name: SpaceBar
options:
  bundleIdPrefix: com.spacebar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.3
targets:
  SpaceBar:
    type: application
    platform: macOS
    sources:
      - path: SpaceBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacebar.app
        PRODUCT_NAME: SpaceBar
        INFOPLIST_FILE: SpaceBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpaceBar/SpaceBar.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
    entitlements:
      path: SpaceBar/SpaceBar.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    scheme:
      testTargets:
        - SpaceBarTests
    preBuildScripts:
      - name: SwiftFormat
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if which swiftformat >/dev/null; then
            swiftformat "${SRCROOT}/SpaceBar" "${SRCROOT}/SpaceBarTests" --config "${SRCROOT}/.swiftformat"
          else
            echo "warning: SwiftFormat not installed (brew install swiftformat)"
          fi
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if which swiftlint >/dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --strict "${SRCROOT}/SpaceBar" "${SRCROOT}/SpaceBarTests"
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi
  SpaceBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpaceBarTests
        excludes:
          - "**/__Snapshots__/**"
          - "**/*.png"
    dependencies:
      - target: SpaceBar
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacebar.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
