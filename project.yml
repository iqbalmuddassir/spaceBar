name: SpaceBar
options:
  bundleIdPrefix: com.spacebar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  SpaceBar:
    type: application
    platform: macOS
    sources:
      - path: SpaceBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacebar.app
        PRODUCT_NAME: SpaceBar
        INFOPLIST_FILE: SpaceBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpaceBar/SpaceBar.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: SpaceBar/SpaceBar.entitlements
